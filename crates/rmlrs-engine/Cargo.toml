[package]
name = "rmlrs-engine"
description = "Mapping execution for RMLrs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rmlrs-model.workspace = true
rmlrs-term.workspace = true
rmlrs-source.workspace = true
serde_json.workspace = true
percent-encoding = { workspace = true, optional = true }

[features]
# RML-FNML function execution with the built-in functions.
fnml = ["dep:percent-encoding"]
xml = ["rmlrs-source/xml"]
compression = ["rmlrs-source/compression"]
postgres = ["rmlrs-source/postgres"]
mysql = ["rmlrs-source/mysql"]
mssql = ["rmlrs-source/mssql"]
# Remote sources (DCAT, Web of Things) fetched over HTTP(S).
http = ["rmlrs-source/http"]

[dev-dependencies]
rmlrs-parser.workspace = true

[lints]
workspace = true
