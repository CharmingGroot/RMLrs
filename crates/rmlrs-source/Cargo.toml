[package]
name = "rmlrs-source"
description = "Logical sources for RMLrs: JSON, CSV, SQL and XML"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
flate2 = { workspace = true, optional = true }
lzma-rust2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
mysql = { version = "28.0.3", default-features = false, features = ["minimal"], optional = true }
postgres = { version = "0.19", optional = true }
rmlrs-model.workspace = true
serde_json.workspace = true
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono"], optional = true }
xee-xpath = { workspace = true, optional = true }
xot = { workspace = true, optional = true }
xmlparser = { workspace = true, optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "net"], optional = true }
tokio-util = { version = "0.7", default-features = false, features = ["compat"], optional = true }
# HTTP(S) sources (feature "http"): a blocking client on rustls with the ring
# provider and the operating system's root certificates, so no OpenSSL and
# no bundled certificate list.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }

[lints]
workspace = true

[features]
xml = ["dep:xee-xpath", "dep:xot", "dep:xmlparser"]
compression = ["dep:flate2", "dep:lzma-rust2", "dep:tar", "dep:zip"]
postgres = ["dep:postgres"]
mysql = ["dep:mysql"]
mssql = ["dep:tiberius", "dep:tokio", "dep:tokio-util"]
http = ["dep:ureq", "dep:rustls", "dep:rustls-native-certs"]
