[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "rmlrs"
description = "RML (RDF Mapping Language) engine written in Rust"
requires-python = ">=3.9"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Ho Geun Choi" }]
keywords = ["rml", "rdf", "knowledge-graph", "r2rml", "semantic-web"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dynamic = ["version"]

[project.urls]
Repository = "https://github.com/CharmingGroot/RMLrs"
Documentation = "https://github.com/CharmingGroot/RMLrs/tree/main/docs"
Changelog = "https://github.com/CharmingGroot/RMLrs/blob/main/CHANGELOG.md"

[tool.maturin]
module-name = "rmlrs"
