name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Keep shared guidance tool-neutral
        run: |
          if git ls-files | grep -E '(^|/)(AGENTS|CLAUDE|GEMINI)\.md$|(^|/)\.cursorrules$|(^|/)\.(claude|codex|cursor)/|^\.github/(copilot-instructions\.md$|instructions/|agents/)'; then
            echo '::error::Move shared guidance to CONTRIBUTING.md; keep tool-specific configuration out of the repository.'
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      # JSON conformance on every pull request. SQL cases run nightly (ADR 0004).
      - name: Conformance (no regressions against the baseline)
        run: cargo run --release -p rmlrs-conformance -- --check conformance/baseline.csv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-results
          path: conformance/results/

  # The minimum supported Rust version declared in Cargo.toml.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features

  # Every commit of a pull request is signed off by its author (DCO).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            # Dependency bots cannot sign off; their changes are reviewed on merge.
            case "$author" in *"[bot]"*) continue ;; esac
            if ! git log -1 --format=%B "$c" | grep -qF "Signed-off-by: $author"; then
              echo "::error::commit $c is not signed off by $author (git commit -s)"
              missing=1
            fi
          done
          exit $missing

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: cargo build --release -p rmlrs-cli
      # Python wheel: same output as the native CLI on RML-Core.
      - run: pip install maturin && maturin build --release -m bindings/python/Cargo.toml
      - run: pip install target/wheels/*.whl && python bindings/python/tests/core_parity.py target/release/rmlrs conformance/suites
      # WebAssembly: same check through Node.
      - run: |
          cargo build --release -p rmlrs-wasm --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version "$(cargo metadata --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="wasm-bindgen"))')"
          wasm-bindgen --target nodejs --out-dir /tmp/pkg target/wasm32-unknown-unknown/release/rmlrs_wasm.wasm
          node bindings/wasm/tests/core_parity.mjs /tmp/pkg target/release/rmlrs conformance/suites
